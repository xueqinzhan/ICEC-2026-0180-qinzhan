<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户反馈 - 校园WiFi信号地图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #667eea; margin-bottom: 8px; font-size: 1.5em; }
        .subtitle { color: #888; margin-bottom: 24px; font-size: 0.9em; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95em;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .rating-group { display: flex; gap: 8px; margin-top: 6px; }
        .rating-btn {
            width: 40px; height: 40px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.2s;
        }
        .rating-btn:hover, .rating-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .success-msg {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .success-msg .icon { font-size: 3em; margin-bottom: 10px; }
        .success-msg h2 { color: #28a745; margin-bottom: 10px; }
        .success-msg p { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div id="formSection">
                <h1>校园WiFi信号地图 · 用户反馈</h1>
                <p class="subtitle">ICEC 2026 项目四 · 您的反馈将帮助我们改进产品</p>

                <form id="feedbackForm">
                    <div class="form-group">
                        <label>您的称呼（可选）</label>
                        <input type="text" id="userName" placeholder="如：张同学">
                    </div>

                    <div class="form-group">
                        <label>使用频率</label>
                        <select id="usageFreq" required>
                            <option value="">请选择</option>
                            <option value="daily">每天使用</option>
                            <option value="weekly">每周几次</option>
                            <option value="occasional">偶尔使用</option>
                            <option value="first">第一次使用</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>您最常用的功能</label>
                        <select id="mainFeature" required>
                            <option value="">请选择</option>
                            <option value="map">信号分布地图</option>
                            <option value="heatmap">信号热力图</option>
                            <option value="data">数据列表查看</option>
                            <option value="add">添加测量点</option>
                            <option value="export">数据导出</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>整体满意度</label>
                        <div class="rating-group" id="satisfactionRating">
                            <button type="button" class="rating-btn" data-val="1">1</button>
                            <button type="button" class="rating-btn" data-val="2">2</button>
                            <button type="button" class="rating-btn" data-val="3">3</button>
                            <button type="button" class="rating-btn" data-val="4">4</button>
                            <button type="button" class="rating-btn" data-val="5">5</button>
                        </div>
                        <input type="hidden" id="satisfaction" required>
                    </div>

                    <div class="form-group">
                        <label>界面易用性</label>
                        <div class="rating-group" id="usabilityRating">
                            <button type="button" class="rating-btn" data-val="1">1</button>
                            <button type="button" class="rating-btn" data-val="2">2</button>
                            <button type="button" class="rating-btn" data-val="3">3</button>
                            <button type="button" class="rating-btn" data-val="4">4</button>
                            <button type="button" class="rating-btn" data-val="5">5</button>
                        </div>
                        <input type="hidden" id="usability" required>
                    </div>

                    <div class="form-group">
                        <label>数据准确性</label>
                        <div class="rating-group" id="accuracyRating">
                            <button type="button" class="rating-btn" data-val="1">1</button>
                            <button type="button" class="rating-btn" data-val="2">2</button>
                            <button type="button" class="rating-btn" data-val="3">3</button>
                            <button type="button" class="rating-btn" data-val="4">4</button>
                            <button type="button" class="rating-btn" data-val="5">5</button>
                        </div>
                        <input type="hidden" id="accuracy" required>
                    </div>

                    <div class="form-group">
                        <label>您觉得最有用的功能是什么？</label>
                        <textarea id="usefulFeature" placeholder="请简要描述"></textarea>
                    </div>

                    <div class="form-group">
                        <label>您希望增加什么功能？</label>
                        <textarea id="wishFeature" placeholder="请简要描述"></textarea>
                    </div>

                    <div class="form-group">
                        <label>其他建议或意见</label>
                        <textarea id="comments" placeholder="任何想法都欢迎分享"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">提交反馈</button>
                </form>
            </div>

            <div class="success-msg" id="successSection">
                <div class="icon">✅</div>
                <h2>感谢您的反馈！</h2>
                <p>您的意见对我们非常重要。</p>
                <p style="margin-top:10px;font-size:0.85em;color:#999;">反馈已保存到本地</p>
            </div>
        </div>
    </div>

    <script>
        const FEEDBACK_KEY = 'campus_wifi_feedback';

        // Rating buttons
        document.querySelectorAll('.rating-group').forEach(group => {
            group.addEventListener('click', e => {
                if (e.target.classList.contains('rating-btn')) {
                    group.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
                    e.target.classList.add('selected');
                    const hiddenId = group.id.replace('Rating', '');
                    document.getElementById(hiddenId).value = e.target.dataset.val;
                }
            });
        });

        // Form submission
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const feedback = {
                timestamp: new Date().toISOString(),
                userName: document.getElementById('userName').value.trim() || '匿名用户',
                usageFreq: document.getElementById('usageFreq').value,
                mainFeature: document.getElementById('mainFeature').value,
                satisfaction: parseInt(document.getElementById('satisfaction').value),
                usability: parseInt(document.getElementById('usability').value),
                accuracy: parseInt(document.getElementById('accuracy').value),
                usefulFeature: document.getElementById('usefulFeature').value.trim(),
                wishFeature: document.getElementById('wishFeature').value.trim(),
                comments: document.getElementById('comments').value.trim()
            };

            // Save to localStorage
            const existing = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]');
            existing.push(feedback);
            localStorage.setItem(FEEDBACK_KEY, JSON.stringify(existing));

            // Show success
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('successSection').style.display = 'block';

            // Also download as JSON for submission
            const blob = new Blob([JSON.stringify(existing, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'user_feedback.json';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
