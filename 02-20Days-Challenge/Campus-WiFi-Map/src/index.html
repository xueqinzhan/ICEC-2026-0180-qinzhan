<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园WiFi信号地图 - ICEC 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.1em; opacity: 0.9; }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .panel h2 {
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 { font-size: 0.9em; opacity: 0.9; margin-bottom: 10px; }
        .stat-card .value { font-size: 2em; font-weight: bold; }
        .stat-card .unit { font-size: 0.5em; opacity: 0.8; }

        .floor-plan {
            position: relative;
            width: 100%;
            height: 550px;
            background: #f0f4f8;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .building-outline {
            position: absolute;
            border: 2px dashed #a0aec0;
            border-radius: 6px;
            background: rgba(226, 232, 240, 0.4);
        }

        .building-label {
            position: absolute;
            font-size: 11px;
            color: #718096;
            font-weight: bold;
            pointer-events: none;
        }

        .corridor {
            position: absolute;
            background: rgba(203, 213, 224, 0.5);
        }

        .signal-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.15;
            transform: translate(-50%, -50%);
        }

        .wifi-point {
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .wifi-point:hover {
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            z-index: 20;
        }

        .signal-excellent { background: #28a745; }
        .signal-good { background: #20c997; }
        .signal-fair { background: #ffc107; color: #333; }
        .signal-poor { background: #dc3545; }

        .ring-excellent { background: #28a745; }
        .ring-good { background: #20c997; }
        .ring-fair { background: #ffc107; }
        .ring-poor { background: #dc3545; }

        .point-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .wifi-point:hover .point-tooltip { opacity: 1; }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .legend-color { width: 20px; height: 20px; border-radius: 50%; }

        .detail-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .detail-modal.active { display: flex; }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 520px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-content h3 { color: #667eea; margin-bottom: 5px; font-size: 1.3em; }
        .modal-content .subtitle { color: #888; font-size: 0.9em; margin-bottom: 15px; }

        .modal-content table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .modal-content th, .modal-content td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
        .modal-content th { background: #f8f9fa; font-weight: bold; color: #555; width: 40%; }

        .signal-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            color: white;
            font-size: 0.85em;
            font-weight: bold;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }

        .close-btn:hover { color: #333; }

        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .chart-row { grid-template-columns: 1fr; }
            header h1 { font-size: 1.8em; }
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 250px;
            padding: 10px 5px 0;
            border-bottom: 2px solid #e2e8f0;
            position: relative;
        }

        .bar-chart::before {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 100%;
            background: repeating-linear-gradient(
                to top,
                transparent,
                transparent 49px,
                #edf2f7 49px,
                #edf2f7 50px
            );
            pointer-events: none;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 80px;
            position: relative;
        }

        .bar {
            width: 40px;
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .bar:hover { opacity: 0.85; }

        .bar-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 11px;
            color: #333;
            white-space: nowrap;
        }

        .bar-label {
            margin-top: 6px;
            font-size: 10px;
            color: #666;
            text-align: center;
            line-height: 1.2;
            max-width: 70px;
            word-break: keep-all;
        }

        .rounds-detail {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .rounds-detail h4 { color: #667eea; margin-bottom: 8px; font-size: 0.95em; }
        .rounds-table { width: 100%; font-size: 0.85em; }
        .rounds-table th { background: #f0f4ff; }

        footer { text-align: center; color: white; opacity: 0.8; margin-top: 30px; padding-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>校园WiFi信号地图</h1>
            <p>ICEC 2026-0180 | 深圳城市职业学院 | 基于24组实测数据</p>
        </header>

        <div class="panel">
            <h2>数据概览</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>测试点位</h3>
                    <div class="value">8 <span class="unit">个</span></div>
                </div>
                <div class="stat-card">
                    <h3>总测量次数</h3>
                    <div class="value">24 <span class="unit">组</span></div>
                </div>
                <div class="stat-card">
                    <h3>平均信号强度</h3>
                    <div class="value">-62 <span class="unit">dBm</span></div>
                </div>
                <div class="stat-card">
                    <h3>平均下载速度</h3>
                    <div class="value">43 <span class="unit">Mbps</span></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>WiFi信号分布图（点击圆点查看详情）</h2>
            <div class="floor-plan" id="floorPlan"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color signal-excellent"></div>
                    <span>优秀 (> -55 dBm)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color signal-good"></div>
                    <span>良好 (-55 ~ -65 dBm)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color signal-fair"></div>
                    <span>一般 (-65 ~ -75 dBm)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color signal-poor"></div>
                    <span>较差 (< -75 dBm)</span>
                </div>
            </div>
        </div>

        <div class="chart-row">
            <div class="panel">
                <h2>信号强度对比 (dBm)</h2>
                <div class="bar-chart" id="signalChart"></div>
            </div>
            <div class="panel">
                <h2>下载速度对比 (Mbps)</h2>
                <div class="bar-chart" id="speedChart"></div>
            </div>
        </div>

        <div class="panel">
            <h2>延迟对比 (ms)</h2>
            <div class="bar-chart" id="latencyChart" style="height:220px;"></div>
        </div>

        <footer>
            <p>ICEC 2026-0180 | 深圳城市职业学院 | 数据采集：2026-10-22</p>
        </footer>
    </div>

    <div class="detail-modal" id="detailModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        const wifiData = [
            {
                id: 1, name: '431实训楼内部', env: '无遮挡/室内', x: 55, y: 35,
                signal: -44, latency: 10, download: 82.5, upload: 41.5,
                rounds: [
                    { s: -43, l: 10, d: 81.9, u: 39.6 },
                    { s: -45, l: 8,  d: 84.7, u: 43.4 },
                    { s: -44, l: 11, d: 81.0, u: 41.4 }
                ]
            },
            {
                id: 2, name: '431走廊靠窗', env: '室内/靠窗', x: 75, y: 35,
                signal: -54, latency: 13, download: 61.6, upload: 29.0,
                rounds: [
                    { s: -56, l: 14, d: 59.5, u: 28.1 },
                    { s: -55, l: 12, d: 59.8, u: 28.5 },
                    { s: -52, l: 12, d: 65.6, u: 30.3 }
                ]
            },
            {
                id: 3, name: '实训楼门口', env: '室外/室内过渡', x: 90, y: 50,
                signal: -63, latency: 19, download: 43.6, upload: 22.7,
                rounds: [
                    { s: -66, l: 21, d: 48.4, u: 24.8 },
                    { s: -58, l: 20, d: 41.7, u: 21.9 },
                    { s: -65, l: 17, d: 40.6, u: 21.3 }
                ]
            },
            {
                id: 4, name: '走廊靠窗角落', env: '室内/靠窗', x: 75, y: 60,
                signal: -50, latency: 14, download: 59.9, upload: 28.9,
                rounds: [
                    { s: -48, l: 13, d: 60.8, u: 27.7 },
                    { s: -53, l: 17, d: 63.0, u: 28.3 },
                    { s: -50, l: 12, d: 56.0, u: 30.8 }
                ]
            },
            {
                id: 5, name: '走廊靠墙角落', env: '室内/靠墙角落', x: 55, y: 72,
                signal: -65, latency: 24, download: 33.0, upload: 13.6,
                rounds: [
                    { s: -67, l: 25, d: 34.5, u: 12.3 },
                    { s: -67, l: 25, d: 35.5, u: 12.9 },
                    { s: -62, l: 22, d: 28.9, u: 15.6 }
                ]
            },
            {
                id: 6, name: '楼梯转角', env: '室外靠墙/混凝土', x: 20, y: 80,
                signal: -78, latency: 45, download: 18.6, upload: 8.0,
                rounds: [
                    { s: -76, l: 43, d: 14.2, u: 10.3 },
                    { s: -81, l: 46, d: 19.2, u: 7.5 },
                    { s: -77, l: 45, d: 22.3, u: 6.2 }
                ]
            },
            {
                id: 7, name: '数据机房', env: '室内/金属机柜遮挡', x: 12, y: 45,
                signal: -82, latency: 55, download: 14.2, upload: 3.6,
                rounds: [
                    { s: -79, l: 53, d: 11.0, u: 6.0 },
                    { s: -85, l: 54, d: 14.5, u: 2.4 },
                    { s: -83, l: 58, d: 17.0, u: 2.4 }
                ]
            },
            {
                id: 8, name: '食堂/图书馆入口', env: '开放空间', x: 40, y: 18,
                signal: -57, latency: 20, download: 51.9, upload: 26.7,
                rounds: [
                    { s: -61, l: 19, d: 54.3, u: 27.3 },
                    { s: -53, l: 19, d: 46.6, u: 27.0 },
                    { s: -56, l: 21, d: 54.9, u: 25.9 }
                ]
            }
        ];

        function getSignalClass(s) {
            if (s > -55) return 'excellent';
            if (s > -65) return 'good';
            if (s > -75) return 'fair';
            return 'poor';
        }

        function getSignalLabel(s) {
            if (s > -55) return '优秀';
            if (s > -65) return '良好';
            if (s > -75) return '一般';
            return '较差';
        }

        function getBadgeColor(cls) {
            return { excellent: '#28a745', good: '#20c997', fair: '#ffc107', poor: '#dc3545' }[cls];
        }

        function renderFloorPlan() {
            const fp = document.getElementById('floorPlan');

            const buildings = [
                { label: '431实训室', x: 45, y: 25, w: 38, h: 22 },
                { label: '走廊', x: 45, y: 47, w: 38, h: 30 },
                { label: '食堂/图书馆', x: 25, y: 8, w: 30, h: 16 },
                { label: '楼梯间', x: 8, y: 68, w: 20, h: 20 },
                { label: '数据机房', x: 4, y: 36, w: 18, h: 18 },
            ];

            buildings.forEach(b => {
                const div = document.createElement('div');
                div.className = 'building-outline';
                div.style.left = b.x + '%';
                div.style.top = b.y + '%';
                div.style.width = b.w + '%';
                div.style.height = b.h + '%';
                fp.appendChild(div);

                const lbl = document.createElement('div');
                lbl.className = 'building-label';
                lbl.style.left = (b.x + b.w / 2) + '%';
                lbl.style.top = (b.y + 4) + '%';
                lbl.style.transform = 'translateX(-50%)';
                lbl.textContent = b.label;
                fp.appendChild(lbl);
            });

            wifiData.forEach(p => {
                const cls = getSignalClass(p.signal);
                const ringSize = Math.max(60, (100 + p.signal) * 2.5);

                const ring = document.createElement('div');
                ring.className = `signal-ring ring-${cls}`;
                ring.style.left = p.x + '%';
                ring.style.top = p.y + '%';
                ring.style.width = ringSize + 'px';
                ring.style.height = ringSize + 'px';
                fp.appendChild(ring);

                const dot = document.createElement('div');
                dot.className = `wifi-point signal-${cls}`;
                dot.style.left = p.x + '%';
                dot.style.top = p.y + '%';
                dot.innerHTML = `${p.id}<span class="point-tooltip">${p.name} ${p.signal}dBm</span>`;
                dot.onclick = () => showDetail(p);
                fp.appendChild(dot);
            });
        }

        function showDetail(p) {
            const cls = getSignalClass(p.signal);
            const color = getBadgeColor(cls);
            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');

            let roundsHtml = '<table class="rounds-table"><tr><th>轮次</th><th>信号(dBm)</th><th>延迟(ms)</th><th>下载(Mbps)</th><th>上传(Mbps)</th></tr>';
            p.rounds.forEach((r, i) => {
                roundsHtml += `<tr><td>第${i + 1}轮</td><td>${r.s}</td><td>${r.l}</td><td>${r.d}</td><td>${r.u}</td></tr>`;
            });
            roundsHtml += '</table>';

            body.innerHTML = `
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h3>点位${p.id}：${p.name}</h3>
                <div class="subtitle">${p.env}</div>
                <table>
                    <tr><td>信号强度</td><td><span class="signal-badge" style="background:${color}">${p.signal} dBm ${getSignalLabel(p.signal)}</span></td></tr>
                    <tr><td>延迟</td><td>${p.latency} ms</td></tr>
                    <tr><td>下载速度</td><td>${p.download} Mbps</td></tr>
                    <tr><td>上传速度</td><td>${p.upload} Mbps</td></tr>
                </table>
                <div class="rounds-detail">
                    <h4>3轮实测明细</h4>
                    ${roundsHtml}
                </div>
            `;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function renderBarChart(containerId, data, valueKey, maxVal, colorFn) {
            const chart = document.getElementById(containerId);
            data.forEach(p => {
                const val = p[valueKey];
                const group = document.createElement('div');
                group.className = 'bar-group';

                const bar = document.createElement('div');
                bar.className = 'bar';
                const pct = colorFn ? (Math.abs(val) / maxVal * 100) : (val / maxVal * 100);
                bar.style.height = pct + '%';
                bar.style.background = colorFn
                    ? `linear-gradient(to top, ${getBadgeColor(getSignalClass(val))}, ${getBadgeColor(getSignalClass(val))}dd)`
                    : 'linear-gradient(to top, #667eea, #764ba2)';

                bar.innerHTML = `<div class="bar-value">${val}</div>`;
                bar.onclick = () => showDetail(p);

                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = p.name;

                group.appendChild(bar);
                group.appendChild(label);
                chart.appendChild(group);
            });
        }

        renderFloorPlan();
        renderBarChart('signalChart', wifiData, 'signal', 100, true);
        renderBarChart('speedChart', wifiData, 'download', 100, false);
        renderBarChart('latencyChart', wifiData, 'latency', 70, false);

        document.getElementById('detailModal').onclick = function (e) {
            if (e.target === this) closeModal();
        };
    </script>
</body>
</html>
